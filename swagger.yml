openapi: 3.0.3
info:
  title: User API
  version: 1.0.0
  description: >
    Create and retrieve users.  
    All calls over HTTPS and protected by RSA digital signatures.

servers:
  - url: https://api.example.com/v1
    description: Production

paths:
  /users:
    post:
      summary: Create a new user
      tags:
        - Users
      parameters:
        - name: X-Client-Signature
          in: header
          required: true
          description: >
            RSA signature of the raw JSON payload.  
            Client signs with its private key; server verifies with the client's public key.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          headers:
            X-Server-Signature:
              description: RSA signature of the response JSON
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          description: Invalid request payload
        '401':
          description: Missing or invalid signature
        '500':
          description: Server error

  /users/{id}:
    get:
      summary: Retrieve user by ID
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric user identifier
          schema:
            type: integer
            format: int64
        - name: X-Client-Signature
          in: header
          required: true
          description: >
            RSA signature of the canonical request string (e.g. path + timestamp).  
            Client signs with its private key; server verifies with the client's public key.
          schema:
            type: string
      responses:
        '200':
          description: User found
          headers:
            X-Server-Signature:
              description: RSA signature of the response JSON
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '401':
          description: Missing or invalid signature
        '404':
          description: User not found
        '500':
          description: Server error

components:
  securitySchemes:
    SignatureAuth:
      type: apiKey
      in: header
      name: X-Client-Signature
      description: RSA signature header

  schemas:
    UserDTO:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserCreateRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
          format: email
